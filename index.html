<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Quantum Sacred Geometry</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020005;font-family:monospace}
#webgl-container{position:fixed;inset:0}
.ui{position:fixed;inset:0;z-index:5;pointer-events:none;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
.panel{pointer-events:auto;background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,0,127,.08),rgba(0,255,255,.14));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(0,255,255,.3);border-radius:12px;box-shadow:0 15px 40px #000b,0 0 25px #00ffff22,inset 0 1px #ffffff33}
header{display:flex;justify-content:space-between;gap:8px}.brand,.stats{padding:10px;color:#fff}.brand-title{color:#0ff;font-size:10px;font-weight:bold;letter-spacing:3px}.brand-sub{color:#fa0;font-size:8px;margin-top:4px}.stats{min-width:135px;font-size:8px}.stat{display:flex;justify-content:space-between;gap:15px;margin:3px 0;border-left:2px solid #00ffff44;padding-left:5px}.label{color:#ffffff55}.value{color:#0ff;font-weight:bold}#fps{color:#fa0}
footer{width:100%;display:flex;justify-content:center;padding-bottom:8px}.controls{width:min(430px,100%);padding:10px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}button{border:1px solid #00ffff44;background:#05010fcc;color:#ffffff88;border-radius:8px;padding:9px 3px;font-family:inherit;font-size:9px;letter-spacing:1px}button.active{color:#fff;border-color:#0ff;background:#ff007f38;box-shadow:0 0 12px #00ffff44}.phase{display:flex;justify-content:space-between;margin-top:8px;color:#fff6;font-size:8px}#phase{color:#0ff;font-weight:bold}.bar{height:2px;margin-top:6px;background:#fff1}#progress{height:100%;width:100%;background:#0ff;box-shadow:0 0 12px #0ff;transform-origin:left}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"}}</script>
</head>
<body>
<div id="webgl-container"></div>
<div class="ui">
<header>
<div class="panel brand"><div class="brand-title">QUANTUM ENGINE</div><div class="brand-sub">1.6180 Hz • HIGH ENERGY</div></div>
<div class="panel stats">
<div class="stat"><span class="label">GEOM:</span><span class="value" id="geom">TORUS</span></div>
<div class="stat"><span class="label">STABILITY:</span><span class="value" id="stability">100.00%</span></div>
<div class="stat"><span class="label">FPS:</span><span class="value" id="fps">0</span></div>
</div>
</header>
<footer><div class="panel controls">
<div class="buttons"><button class="active" data-shape="0">TORUS</button><button data-shape="1">CUBE</button><button data-shape="2">STAR</button><button data-shape="3">CAGE</button></div>
<div class="phase"><span>PHASE COHERENCE</span><span id="phase">100%</span></div>
<div class="bar"><div id="progress"></div></div>
</div></footer>
</div>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";
import {OutputPass} from "three/addons/postprocessing/OutputPass.js";

const container=document.getElementById("webgl-container");
const scene=new THREE.Scene();
scene.background=new THREE.Color("#020005");
scene.fog=new THREE.FogExp2("#020005",.035);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);
camera.position.set(0,0,10);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
container.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=4;controls.maxDistance=22;

const material=new THREE.ShaderMaterial({
vertexShader:`varying vec2 vUv;varying vec3 vNormal;void main(){vUv=uv;vNormal=normalize(normalMatrix*mat3(instanceMatrix)*normal);vec4 p=modelViewMatrix*instanceMatrix*vec4(position,1.);gl_Position=projectionMatrix*p;}`,
fragmentShader:`varying vec2 vUv;varying vec3 vNormal;uniform float uTime;void main(){vec3 n=normalize(vNormal);float f=pow(1.-abs(dot(n,vec3(0.,0.,1.))),2.5);float t=uTime*2.5;float e=smoothstep(-.15,.8,sin(vUv.y*18.-t)*cos(vUv.y*37.+t*.7)*sin(vUv.x*25.+t*1.2));float gx=abs(sin(vUv.x*18.849));float gy=abs(sin(vUv.y*56.548));float grid=smoothstep(.88,1.,max(gx,gy));vec3 c=mix(vec3(1.,0.,.5)*.3,vec3(0.,1.,1.),f);c=mix(c,vec3(1.,0.,.5)*1.8,e);c=mix(c,vec3(1.,.67,0.)*1.6,grid*.4);c+=vec3(1.,.67,0.)*f*(sin(uTime*5.)*.5+.5)*.25;gl_FragColor=vec4(clamp(c,0.,5.),clamp(.18+f*.65+e*.2,.15,1.));}`,
uniforms:{uTime:{value:0}},
transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide
});

const NODE_COUNT=373,BEAM_COUNT=756;
const nodes=new THREE.InstancedMesh(new THREE.SphereGeometry(.075,8,8),material,NODE_COUNT);
const beams=new THREE.InstancedMesh(new THREE.CylinderGeometry(1,1,1,6),material,BEAM_COUNT);
nodes.instanceMatrix.setUsage(THREE.DynamicDrawUsage);beams.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(nodes,beams);

function pseudo(i,a){return Math.sin(i*a)*43758.5453%1}
const targets=[[],[],[],[]];
for(let i=0;i<NODE_COUNT;i++){
 let u=i/NODE_COUNT*Math.PI*2,v=(i*2.399963)%(Math.PI*2),R=3,r=1.15;
 targets[0].push(new THREE.Vector3((R+r*Math.cos(v))*Math.cos(u),r*Math.sin(v),(R+r*Math.cos(v))*Math.sin(u)));
 let x=pseudo(i,12.9898)*2-1,y=pseudo(i,78.233)*2-1,z=Math.sin(i*4.123)*.9;
 targets[1].push(new THREE.Vector3(x*3.1,y*3.1,z*3.1));
 let a=i/NODE_COUNT*Math.PI*2,rad=i%2?1.5:3.5;
 targets[2].push(new THREE.Vector3(Math.cos(a)*rad,Math.sin(a*5)*1.5,Math.sin(a)*rad));
 let q=i/NODE_COUNT*Math.PI*2,layer=i%3,rr=layer==0?3.4:layer==1?2.3:1.4;
 targets[3].push(new THREE.Vector3(Math.cos(q)*rr,Math.sin(q*3)*(layer+1),Math.sin(q)*rr));
}
const current=targets[0].map(v=>v.clone());
const connections=[];
for(let i=0;i<NODE_COUNT&&connections.length<BEAM_COUNT;i++){
 let best=[];
 for(let j=0;j<NODE_COUNT;j++)if(i!==j)best.push([current[i].distanceToSquared(current[j]),j]);
 best.sort((a,b)=>a[0]-b[0]);
 for(let k=0;k<2&&k<best.length;k++){
  let a=Math.min(i,best[k][1]),b=Math.max(i,best[k][1]),key=a+"_"+b;
  if(!connections.some(c=>c.key===key))connections.push({a,b,key});
 }
}
const dummy=new THREE.Object3D(),dir=new THREE.Vector3(),mid=new THREE.Vector3(),up=new THREE.Vector3(0,1,0);
function beam(i,a,b){
 dir.subVectors(b,a);let len=dir.length();
 if(len<.001){dummy.scale.set(0,0,0)}else{mid.addVectors(a,b).multiplyScalar(.5);dir.normalize();dummy.position.copy(mid);dummy.quaternion.setFromUnitVectors(up,dir);dummy.scale.set(.018,len,.018)}
 dummy.updateMatrix();beams.setMatrixAt(i,dummy.matrix);
}

let active=0,target=0,morph=1;
document.querySelectorAll("button").forEach(b=>b.onclick=()=>{target=+b.dataset.shape;morph=0;document.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));document.getElementById("geom").textContent=["TORUS","CUBE","STAR","CAGE"][target]});

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.7,.8,.15));
composer.addPass(new OutputPass());

const clock=new THREE.Clock();let elapsed=0,fc=0,ft=performance.now();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);elapsed+=dt;material.uniforms.uTime.value=elapsed;
 if(morph<1){morph=Math.min(1,morph+dt/1.8);let e=morph<.5?2*morph*morph:1-Math.pow(-2*morph+2,2)/2;for(let i=0;i<NODE_COUNT;i++)current[i].lerpVectors(targets[active][i],targets[target][i],e);if(morph>=1)active=target}
 for(let i=0;i<NODE_COUNT;i++){let p=current[i],s=1+Math.sin(elapsed*3+i*.37)*.08;dummy.position.copy(p);dummy.rotation.set(elapsed*.2,elapsed*.3,elapsed*.15);dummy.scale.setScalar(s);dummy.updateMatrix();nodes.setMatrixAt(i,dummy.matrix)}
 for(let i=0;i<connections.length;i++){let c=connections[i];beam(i,current[c.a],current[c.b])}
 nodes.instanceMatrix.needsUpdate=true;beams.instanceMatrix.needsUpdate=true;
 scene.rotation.y=Math.sin(elapsed*.15)*.18;scene.rotation.x=Math.sin(elapsed*.11)*.08;
 controls.update();composer.render();
 fc++;let now=performance.now();if(now-ft>=500){let fps=fc/((now-ft)/1000);document.getElementById("fps").textContent=fps.toFixed(0);document.getElementById("stability").textContent=Math.min(100,fps/60*100).toFixed(2)+"%";fc=0;ft=now}
 document.getElementById("phase").textContent=Math.round(morph*100)+"%";document.getElementById("progress").style.transform=`scaleX(${morph})`;
}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
animate();
</script>
</body>
</html>
